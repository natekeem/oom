<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="22" flood-color="#0f172a" flood-opacity=".14"/></filter></defs>
  <rect width="1440" height="900" fill="#f5f7fa"/>
  <text x="72" y="72" font-family="'Noto Sans CJK KR', NanumGothic, system-ui, sans-serif" font-size="30" font-weight="800" fill="#111827">STEP 6 — 답변 복기 화면 레퍼런스</text>
  <text x="72" y="108" font-family="'Noto Sans CJK KR', NanumGothic, system-ui, sans-serif" font-size="16" fill="#667085">시험 화면에서 답변이 끝나면 녹음 → STT → AI 피드백의 3단계 복기로 전환</text>

  <g filter="url(#shadow)">
    <rect x="70" y="145" width="1300" height="680" rx="12" fill="#ffffff"/>
    <rect x="70" y="145" width="1300" height="56" rx="12" fill="#111827"/>
    <rect x="70" y="190" width="1300" height="11" fill="#111827"/>
  </g>
  <text x="100" y="181" font-family="Noto Sans CJK KR, NanumGothic, system-ui, sans-serif" font-size="16" font-weight="700" fill="white">OOM OPIc Practice · Answer Review</text>
  <text x="1145" y="181" font-family="'Noto Sans CJK KR', NanumGothic, system-ui, sans-serif" font-size="13" fill="#cbd5e1">같은 질문 다시 말하기</text>

  <!-- 1 audio -->
  <rect x="100" y="235" width="360" height="520" rx="10" fill="#f8fafc" stroke="#d7dce2"/>
  <circle cx="132" cy="272" r="14" fill="#2563eb"/>
  <text x="132" y="278" text-anchor="middle" font-family="Noto Sans CJK KR, NanumGothic, system-ui" font-size="12" font-weight="800" fill="white">1</text>
  <text x="158" y="278" font-family="'Noto Sans CJK KR', NanumGothic, system-ui" font-size="17" font-weight="800" fill="#111827">내 녹음</text>
  <rect x="126" y="316" width="308" height="94" rx="8" fill="white" stroke="#d7dce2"/>
  <circle cx="168" cy="363" r="24" fill="#2563eb"/>
  <polygon points="160,350 160,376 181,363" fill="white"/>
  <text x="208" y="356" font-family="Noto Sans CJK KR, NanumGothic, system-ui" font-size="12" fill="#475569">00:00 / 00:58</text>
  <path d="M207 378 C220 365 233 390 246 376 C260 362 273 392 287 376 C300 365 313 388 326 376 C340 364 353 391 366 377 C379 365 392 388 406 376" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <text x="126" y="458" font-family="'Noto Sans CJK KR', NanumGothic, system-ui" font-size="13" fill="#64748b">먼저 방금 말한 답변을 한 번 들어보세요.</text>

  <!-- 2 STT -->
  <rect x="485" y="235" width="500" height="520" rx="10" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  <circle cx="518" cy="272" r="14" fill="#2563eb"/>
  <text x="518" y="278" text-anchor="middle" font-family="Noto Sans CJK KR, NanumGothic, system-ui" font-size="12" font-weight="800" fill="white">2</text>
  <text x="544" y="278" font-family="'Noto Sans CJK KR', NanumGothic, system-ui" font-size="17" font-weight="800" fill="#111827">음성 받아쓰기 (STT)</text>
  <rect x="514" y="310" width="440" height="54" rx="7" fill="#ecfdf5"/>
  <text x="536" y="342" font-family="'Noto Sans CJK KR', NanumGothic, system-ui" font-size="13" font-weight="800" fill="#047857">✓ STT 준비됨 · 녹음 종료 후 자동 변환</text>
  <text x="514" y="400" font-family="'Noto Sans CJK KR', NanumGothic, system-ui" font-size="12" fill="#64748b">내 답변 Transcript · AI 피드백 전에 직접 수정 가능</text>
  <rect x="514" y="420" width="440" height="210" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="536" y="454" font-family="Noto Sans CJK KR, NanumGothic, system-ui" font-size="14" fill="#334155">I usually go to a small cafe near my apartment.</text>
  <text x="536" y="482" font-family="Noto Sans CJK KR, NanumGothic, system-ui" font-size="14" fill="#334155">I like the window seat because it is quiet and bright.</text>
  <text x="536" y="510" font-family="Noto Sans CJK KR, NanumGothic, system-ui" font-size="14" fill="#334155">Last weekend, I stayed there for about two hours...</text>
  <rect x="514" y="654" width="145" height="44" rx="6" fill="white" stroke="#93c5fd"/>
  <text x="586" y="681" text-anchor="middle" font-family="'Noto Sans CJK KR', NanumGothic, system-ui" font-size="13" font-weight="800" fill="#1d4ed8">다시 변환</text>

  <!-- 3 AI -->
  <rect x="1010" y="235" width="330" height="520" rx="10" fill="#f8fafc" stroke="#d7dce2"/>
  <circle cx="1042" cy="272" r="14" fill="#2563eb"/>
  <text x="1042" y="278" text-anchor="middle" font-family="Noto Sans CJK KR, NanumGothic, system-ui" font-size="12" font-weight="800" fill="white">3</text>
  <text x="1068" y="278" font-family="'Noto Sans CJK KR', NanumGothic, system-ui" font-size="17" font-weight="800" fill="#111827">AI 맞춤 피드백</text>
  <rect x="1036" y="322" width="278" height="52" rx="7" fill="#2563eb"/>
  <text x="1175" y="354" text-anchor="middle" font-family="'Noto Sans CJK KR', NanumGothic, system-ui" font-size="14" font-weight="800" fill="white">AI 피드백 받기</text>
  <text x="1036" y="420" font-family="'Noto Sans CJK KR', NanumGothic, system-ui" font-size="13" font-weight="800" fill="#111827">피드백 흐름</text>
  <text x="1036" y="452" font-family="'Noto Sans CJK KR', NanumGothic, system-ui" font-size="13" fill="#475569">• 목표 구간 적합도</text>
  <text x="1036" y="480" font-family="'Noto Sans CJK KR', NanumGothic, system-ui" font-size="13" fill="#475569">• 질문 대응 / 답변 구조</text>
  <text x="1036" y="508" font-family="'Noto Sans CJK KR', NanumGothic, system-ui" font-size="13" fill="#475569">• 유지할 점 2개</text>
  <text x="1036" y="536" font-family="'Noto Sans CJK KR', NanumGothic, system-ui" font-size="13" fill="#475569">• 가장 먼저 고칠 점 1개</text>
  <text x="1036" y="564" font-family="'Noto Sans CJK KR', NanumGothic, system-ui" font-size="13" fill="#475569">• 재도전 미션</text>
  <rect x="1036" y="654" width="278" height="44" rx="6" fill="#111827"/>
  <text x="1175" y="681" text-anchor="middle" font-family="'Noto Sans CJK KR', NanumGothic, system-ui" font-size="13" font-weight="800" fill="white">피드백 반영하여 다시 말하기</text>

  <text x="720" y="856" text-anchor="middle" font-family="'Noto Sans CJK KR', NanumGothic, system-ui" font-size="14" fill="#64748b">STT 미설정 / 준비됨 / 변환 중 / 완료 / 실패 상태를 이 영역에서 항상 명확하게 표시</text>
</svg>