<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OOM Kokoro Dev Benchmark</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background: #09090b; color: #f4f4f5; }
      body { margin: 0; padding: 32px; }
      main { width: min(1120px, 100%); margin: 0 auto; }
      h1 { margin: 0; font-size: 24px; }
      p { color: #a1a1aa; line-height: 1.6; }
      textarea { box-sizing: border-box; width: 100%; min-height: 180px; padding: 14px; border: 1px solid #3f3f46; border-radius: 8px; background: #18181b; color: #f4f4f5; }
      button { margin: 16px 0; padding: 10px 16px; border: 0; border-radius: 8px; background: #4f46e5; color: white; font-weight: 700; cursor: pointer; }
      button:disabled { cursor: wait; opacity: .6; }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th, td { padding: 10px; border-bottom: 1px solid #27272a; text-align: right; vertical-align: top; }
      th:first-child, td:first-child, th:last-child, td:last-child { text-align: left; }
      pre { overflow: auto; padding: 14px; border: 1px solid #27272a; border-radius: 8px; background: #18181b; font-size: 12px; }
      #status { min-height: 24px; color: #a5b4fc; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <h1>OOM Kokoro 개발용 Benchmark</h1>
      <p>제품 기본값은 변경하지 않습니다. q8/WASM current·streaming과 지원 시 fp32/WebGPU를 같은 Bella 1.00× 입력으로 측정합니다.</p>
      <textarea id="benchmark-text" aria-label="Benchmark text"></textarea>
      <button id="run-benchmark" type="button">Benchmark 실행</button>
      <p id="status" role="status">실행 대기</p>
      <table aria-label="TTS benchmark result">
        <thead>
          <tr><th>Mode</th><th>Model load</th><th>First audio</th><th>Total</th><th>Audio</th><th>Ratio</th><th>Gap</th><th>Notes</th></tr>
        </thead>
        <tbody id="results"></tbody>
      </table>
      <h2>Environment / raw report</h2>
      <pre id="report-json">아직 결과가 없습니다.</pre>
    </main>
    <script type="module">
      import { getDefaultTtsBenchmarkText, runKokoroBenchmark } from "/src/lib/tts/kokoroBenchmark.ts";

      const text = document.querySelector("#benchmark-text");
      const button = document.querySelector("#run-benchmark");
      const status = document.querySelector("#status");
      const results = document.querySelector("#results");
      const reportJson = document.querySelector("#report-json");
      text.value = getDefaultTtsBenchmarkText();

      const seconds = (value) => value == null ? "—" : `${(value / 1000).toFixed(2)}s`;
      const duration = (value) => value == null ? "—" : `${value.toFixed(1)}s`;

      button.addEventListener("click", async () => {
        button.disabled = true;
        results.replaceChildren();
        reportJson.textContent = "측정 중…";
        try {
          const report = await runKokoroBenchmark(text.value, (message) => { status.textContent = message; });
          for (const row of report.results) {
            const tr = document.createElement("tr");
            const cells = [
              row.mode,
              seconds(row.modelLoadMs),
              seconds(row.firstAudioMs),
              seconds(row.totalGenerationMs),
              duration(row.audioDurationSeconds),
              row.generationAudioRatio == null ? "—" : `${row.generationAudioRatio.toFixed(2)}×`,
              row.maxChunkGapMs == null ? "—" : `${(row.maxChunkGapMs / 1000).toFixed(2)}s`,
              `${row.status}: ${row.notes}`,
            ];
            for (const value of cells) {
              const td = document.createElement("td");
              td.textContent = value;
              tr.append(td);
            }
            results.append(tr);
          }
          reportJson.textContent = JSON.stringify(report, null, 2);
        } catch (error) {
          status.textContent = error instanceof Error ? error.message : String(error);
          reportJson.textContent = status.textContent;
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
