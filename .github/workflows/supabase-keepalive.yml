name: Supabase Keep-Alive

on:
  schedule:
    # 매일 UTC 03:00, 15:00 (한국 시간 12:00, 24:00) 12시간마다 실행하여 Supabase 무료 티어 pause 방지
    - cron: '0 3,15 * * *'
  workflow_dispatch: # GitHub Actions 탭에서 수동 실행 가능

jobs:
  heartbeat:
    name: Supabase Heartbeat Ping
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database and Auth API
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "❌ Error: VITE_SUPABASE_URL or VITE_SUPABASE_PUBLISHABLE_KEY is not set in repository Variables or Secrets."
            echo "Please ensure they are configured in Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          CLEAN_URL="${SUPABASE_URL%/}"

          echo "1. Pinging PostgreSQL database via heartbeat RPC ($CLEAN_URL/rest/v1/rpc/heartbeat) ..."
          RESPONSE_FILE=$(mktemp)
          HTTP_STATUS=$(curl -s -w "%{http_code}" -o "$RESPONSE_FILE" \
            -X POST \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            "$CLEAN_URL/rest/v1/rpc/heartbeat")

          echo "DB Heartbeat HTTP Status: $HTTP_STATUS"
          cat "$RESPONSE_FILE"
          echo ""

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "❌ Database heartbeat failed with HTTP $HTTP_STATUS"
            rm -f "$RESPONSE_FILE"
            exit 1
          fi
          rm -f "$RESPONSE_FILE"

          echo "2. Pinging Auth health check ($CLEAN_URL/auth/v1/health) ..."
          AUTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_KEY" \
            "$CLEAN_URL/auth/v1/health")

          echo "Auth Health HTTP Status: $AUTH_STATUS"

          if [ "$AUTH_STATUS" -ge 200 ] && [ "$AUTH_STATUS" -lt 400 ]; then
            echo "✅ Supabase database and auth heartbeat successful! Project remains active."
          else
            echo "⚠️ Warning: Auth health ping returned HTTP $AUTH_STATUS (DB heartbeat succeeded)."
          fi
